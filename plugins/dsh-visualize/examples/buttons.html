<div class="card" style="max-width: 560px;">
  <h3 style="margin-top:0;">按钮对比度检查</h3>
  <p class="text-small text-muted" style="margin-bottom:12px;">主按钮应始终与背景保持可读对比度（浅色/暗色主题都成立）。</p>
  <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
    <button class="btn" type="button">普通按钮</button>
    <button class="btn btn-primary" type="button">主要按钮</button>
    <button class="btn btn-primary" type="button" disabled>主要按钮（禁用）</button>
  </div>
  <p class="text-small text-muted" style="margin:12px 0 0;">主题令牌：<code>button-primary-fill</code> + <code>label-primary-inverted</code>；缺失时按填充色亮度自动选择前景色。</p>
</div>
